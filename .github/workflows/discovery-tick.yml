name: Discovery tick

# Ingest is serial — each video is a download plus a Gemini upload and poll — so
# every tick handles a bounded number of sources and the schedule does the rest.
# Sources still respect their own cadence_hours; onlyDue skips ones not yet due.
on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the hour to avoid GH's peak-minute queueing
  workflow_dispatch:
    inputs:
      maxSources:
        description: 'Sources to process in this run'
        required: false
        default: '2'

concurrency:
  group: discovery-tick
  cancel-in-progress: false   # never interrupt an in-flight ingest mid-write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger discovery
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DISCOVERY_TICK_SECRET: ${{ secrets.DISCOVERY_TICK_SECRET }}
          MAX_SOURCES: ${{ github.event.inputs.maxSources || '2' }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${DISCOVERY_TICK_SECRET:-}" ]; then
            echo "::error::SITE_URL and DISCOVERY_TICK_SECRET repo secrets must be set"
            exit 1
          fi

          code=$(curl -sS -o /tmp/tick.json -w '%{http_code}' \
            --max-time 1500 \
            -X POST \
            -H "x-cron-secret: ${DISCOVERY_TICK_SECRET}" \
            "${SITE_URL%/}/api/internal/discovery/tick?maxSources=${MAX_SOURCES}")

          echo "HTTP $code"
          cat /tmp/tick.json || true
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Discovery tick failed with HTTP $code"
            exit 1
          fi

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('/tmp/tick.json')).get('data', [])
          if not d:
              print('No sources were due.')
          else:
              print('| source | found | ingested | skipped | failed | error |')
              print('|---|---|---|---|---|---|')
              for s in d:
                  print(f"| `{s['sourceId'][:8]}` | {s['found']} | {s['ingested']} | "
                        f"{s['skipped']} | {s['failed']} | {s.get('error') or ''} |")
          PY
